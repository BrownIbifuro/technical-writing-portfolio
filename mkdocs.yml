
site_name: Ibifuro Brown | Technical Writing Portfolio

site_description: A professional portfolio showcasing technical writing, API documentation, developer tutorials, software guides, technical case studies and data documentation.

site_author: Ibifuro Brown Sunday

site_url: "https://brownibifuro.github.io/technical-writing-portfolio/"

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

  palette:
    - scheme: default
      primary: indigo
      accent: blue

  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - About Me: about.md
  - Tools Reference: tools-reference.md
  
  

  - API Documentation:
      - Overview: api-documentation/index.md
      - PageTurner Books API:
          - Overview: api-documentation/pageturner-books/index.md
          - Getting Started: api-documentation/pageturner-books/getting-started.md
          - Authentication: api-documentation/pageturner-books/authentication.md
          - API Reference: api-documentation/pageturner-books/reference.md
          - Data Models: api-documentation/pageturner-books/data-models.md
          - Error Handling: api-documentation/pageturner-books/error-handling.md

  - Developer Tutorials:
      - Overview: developer-tutorials/index.md

  - User Guides:
      - Overview: user-guides/index.md

  - Technical Case Studies:
      - Overview: technical-case-studies/index.md
      - MCP Task Manager: technical-case-studies/mcp-task-manager/index.md

  - Data Documentation:
      - Overview: data-documentation/index.md

  - Troubleshooting:
      - Overview: troubleshooting-guides/index.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search